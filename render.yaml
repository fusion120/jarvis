# Render Blueprint — import this repo and Render builds the Jarvis backend for you.
# After import: fill in the env vars marked `sync: false` in the Render dashboard
# (they are intentionally left blank so secrets never live in git).
services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend -w 1 -b 0.0.0.0:$PORT --timeout 120 app11:app
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY        # REQUIRED — get a free key at console.groq.com
        sync: false
      - key: API_SECRET          # optional — a random string that locks the API
        sync: false
      - key: TELEGRAM_BOT_TOKEN  # optional — for Telegram reminders ("remind me ...")
        sync: false
      - key: TELEGRAM_CHAT_ID    # optional — your Telegram chat id
        sync: false
      - key: CANVAS_TOKEN        # optional — for Canvas assignments
        sync: false
      - key: CANVAS_DOMAIN       # optional — e.g. school.instructure.com
        sync: false
      - key: OUTLOOK_EMAIL       # optional — for Outlook / email reading
        sync: false
      - key: OUTLOOK_PASSWORD    # optional — Outlook app password (fallback)
        sync: false
      - key: OUTLOOK_CLIENT_ID   # optional — Azure AD app (client) ID for XOAUTH2
        sync: false
      - key: OUTLOOK_TENANT_ID   # optional — Azure AD tenant ID (or "common")
        sync: false
      - key: OUTLOOK_REFRESH_TOKEN # optional — OAuth2 refresh token (long-lived)
        sync: false
      - key: ALLOWED_ORIGIN      # optional — lock CORS to your frontend URL
        sync: false
      - key: DIGEST_TIME         # when the daily email digest runs (UTC)
        value: "12:00"
      - key: DIGEST_TZ           # timezone offset (e.g. -05:00 for Houston)
        value: "-05:00"
