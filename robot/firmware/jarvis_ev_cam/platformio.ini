; JARVIS EV / MIMO — ESP32-CAM firmware  v0.2
; ==========================================
; AI-Thinker ESP32-CAM board. Single board = brain + camera.
; Build: pio run            Upload: pio run --target upload
; Monitor: pio device monitor
;
; CONFIG — fill these in before flashing:
;   WIFI_SSID / WIFI_PASS    your WiFi network
;   BACKEND_HOST             your Render backend (no scheme, no path)
;   API_TOKEN                the same API_SECRET your dashboard uses
;
; BOARD NOTES
;   - Get the PSRAM version of the ESP32-CAM (most AI-Thinker boards are).
;   - If the camera fails at boot with "psram" errors, try:
;       board_build.arduino.memory_type = dio_opi   (2MB PSRAM)
;     or comment out -DBOARD_HAS_PSRAM if your board has no PSRAM.
;   - If `board = esp32cam` is not recognized by your platform version,
;     use `board = ai-thinker-esp32-cam`.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DWIFI_SSID=\"YOUR_WIFI\"
  -DWIFI_PASS=\"YOUR_PASSWORD\"
  -DBACKEND_HOST=\"jarvis-3hff.onrender.com\"
  -DBACKEND_PORT=443
  -DBACKEND_SSL=1
  -DAPI_TOKEN=\"YOUR_API_SECRET\"
lib_deps =
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11
  bblanchon/ArduinoJson@^7
  espressif/esp32-camera@^1.0.0
  madhephaestus/ESP32Servo@^3.0.0
